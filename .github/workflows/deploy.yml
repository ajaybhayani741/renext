name: Deploy ReNext App - Staging

on:
  push:
    branches:
      - host-renext-uat

jobs:
  deploy:
    runs-on: ubuntu-latest

    concurrency:
      group: host-staging-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 18.19.0
        uses: actions/setup-node@v4
        with:
          node-version: 18.19.0
          cache: npm

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Create .env
        run: |
          echo "REACT_APP_BASE_URL=https://dev-renext-api.genbanext.com" > .env
          echo "REACT_APP_MAP_KEY=${{ secrets.GOOGLE_MAP_KEY }}" >> .env

      - name: Verify .env
        run: cat .env

      - name: Build React App
        run: npm run build

      - name: Compress Build Folder
        run: tar -czf build.tar.gz -C build .

      - name: Prepare Upload Directory on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ec2-3-113-6-212.ap-northeast-1.compute.amazonaws.com
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            sudo rm -rf /tmp/renext-deploy
            sudo mkdir -p /tmp/renext-deploy
            sudo chown -R ubuntu:ubuntu /tmp/renext-deploy

            echo "Upload directory is ready."

      - name: Upload Build to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ec2-3-113-6-212.ap-northeast-1.compute.amazonaws.com
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: build.tar.gz
          target: /tmp/renext-deploy

      - name: Deploy Build on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ec2-3-113-6-212.ap-northeast-1.compute.amazonaws.com
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            PROJECT_PATH="/home/ubuntu/renext-uat/renext"
            NEW_BUILD="$PROJECT_PATH/build_new"
            CURRENT_BUILD="$PROJECT_PATH/build"
            BACKUP_BUILD="$PROJECT_PATH/build_backup"

            echo "Starting deployment..."

            sudo rm -rf "$NEW_BUILD"
            sudo mkdir -p "$NEW_BUILD"

            sudo tar -xzf /tmp/renext-deploy/build.tar.gz -C "$NEW_BUILD"

            if [ -d "$CURRENT_BUILD" ]; then
              sudo rm -rf "$BACKUP_BUILD"
              sudo mv "$CURRENT_BUILD" "$BACKUP_BUILD"
            fi

            sudo mv "$NEW_BUILD" "$CURRENT_BUILD"

            sudo rm -rf "$BACKUP_BUILD"
            sudo rm -rf /tmp/renext-deploy

            echo "Deployment completed successfully."